name = "ai-voice-call"
main = "src/index.ts"
compatibility_date = "2025-03-01"
workers_dev = true

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"

[vars]
LLM_BASE_URL = ""
STT_BASE_URL = ""
TTS_BASE_URL = ""
LLM_MODEL = ""
STT_MODEL = ""
TTS_MODEL = ""
TTS_VOICE = "alloy"
TTS_ENABLED = "true"
BROWSER_TTS_FALLBACK = "true"
MAX_HISTORY_TURNS = "12"
LLM_MAX_TOKENS = "512"
LLM_TEMPERATURE = "0.7"
SYSTEM_PROMPT = "你是一个中文 AI 助手。默认使用简体中文，回答清楚、自然、有帮助。优先给出可执行建议，少说空话。根据用户语气调整详略；适合语音朗读时使用短句。涉及医疗、药品、投资、法律等高风险内容时，只提供一般信息，提醒不能替代专业人士。若提供了【联网搜索结果】，请优先依据结果回答，不编造实时数据。不要输出思考过程。"

WEB_SEARCH_ENABLED = "true"
